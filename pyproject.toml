[project]
name = "ev-fleet-monitoring"
version = "1.0.0"
description = "Real-Time EV Fleet Monitoring and Predictive Analytics Solution"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the project root importable so `pytest` works like `python -m pytest`
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
