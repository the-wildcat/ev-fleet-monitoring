# Render Blueprint: the web app (Docker) and a PostgreSQL database.
# Render dashboard → New → Blueprint → select this repository. Values marked `sync: false`
# are asked for when the Blueprint is created.
services:
  - type: web
    name: ev-fleet-monitoring
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ev-fleet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # First administrator, created on the first start (see `flask bootstrap`).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Fleet Admin
      # Demo drivers and simulated vehicles so the dashboards aren't empty.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SIMULATOR_ENABLED
        value: "true"
      # Optional SMTP for verification and password-reset emails. Without it, emails are
      # written to the service log.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: ev-fleet-db
    plan: free
    region: singapore
    databaseName: ev_fleet
    user: ev_fleet
